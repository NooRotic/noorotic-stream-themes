<div class="dyew" data-slt-root>
  <div class="dyew-topbar">
    <div class="dyew-swirl" aria-hidden="true"></div>
    <div class="dyew-glass" aria-hidden="true"></div>
    <div class="dyew-card-wrap">
      <div class="dye-title" data-title>{{TITLE}}</div>
      <div class="dye-subtitle" data-subtitle>{{SUBTITLE}}</div>
    </div>
    <div class="dyew-headline">
      <span data-headline>{{TITLE}}</span>
    </div>
  </div>
  <div class="dyew-ticker-bar">
    <div class="dyew-ticker-label">VIBES</div>
    <div class="dyew-ticker-track">
      <div class="dyew-ticker-scroll">
        <span data-ticker>{{SUBTITLE}} — Good vibes only — {{TITLE}} — Peace love stream</span>
        <span data-ticker aria-hidden="true">{{SUBTITLE}} — Good vibes only — {{TITLE}} — Peace love stream</span>
      </div>
    </div>
  </div>
</div>

<div class="brkw" data-slt-root>
  <div class="brkw-topbar">
    <div class="brkw-card">
      <div class="brk-bg" aria-hidden="true"></div>
      <div class="brk-content">
        <div class="brk-badge">BREAKING</div>
        <div class="brk-text">
          <div class="brk-title" data-title>{{TITLE}}</div>
          <div class="brk-subtitle" data-subtitle>{{SUBTITLE}}</div>
        </div>
      </div>
    </div>
    <div class="brkw-headline">
      <span data-headline>{{TITLE}}</span>
    </div>
  </div>
  <div class="brkw-ticker-bar">
    <div class="brkw-ticker-label">ALERT</div>
    <div class="brkw-ticker-track">
      <div class="brkw-ticker-scroll">
        <span data-ticker>{{SUBTITLE}} — Breaking development — {{TITLE}} — More details to follow</span>
        <span data-ticker aria-hidden="true">{{SUBTITLE}} — Breaking development — {{TITLE}} — More details to follow</span>
      </div>
    </div>
  </div>
</div>

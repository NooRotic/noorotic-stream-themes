<div class="corpw" data-slt-root>
  <div class="corpw-topbar">
    <div class="corpw-card">
      <div class="corp-bg" aria-hidden="true"></div>
      <div class="corp-content">
        <img class="corp-avatar" src="{{PROFILE_PICTURE_URL}}" alt="" onerror="this.style.display='none'" />
        <div class="corp-text">
          <div class="corp-title" data-title>{{TITLE}}</div>
          <div class="corp-subtitle" data-subtitle>{{SUBTITLE}}</div>
        </div>
      </div>
    </div>
    <div class="corpw-headline">
      <span data-headline>{{TITLE}}</span>
    </div>
  </div>
  <div class="corpw-ticker-bar">
    <div class="corpw-ticker-label">INFO</div>
    <div class="corpw-ticker-track">
      <div class="corpw-ticker-scroll">
        <span data-ticker>{{SUBTITLE}} — Webinar in progress — {{TITLE}} — Questions welcome</span>
        <span data-ticker aria-hidden="true">{{SUBTITLE}} — Webinar in progress — {{TITLE}} — Questions welcome</span>
      </div>
    </div>
  </div>
</div>

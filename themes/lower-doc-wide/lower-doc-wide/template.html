<div class="ldocw" data-slt-root>
  <div class="ldocw-topbar">
    <div class="ldocw-card">
      <div class="ldoc-bg" aria-hidden="true"></div>
      <div class="ldoc-content">
        <div class="ldoc-title" data-title>{{TITLE}}</div>
        <div class="ldoc-subtitle" data-subtitle>{{SUBTITLE}}</div>
      </div>
    </div>
    <div class="ldocw-headline">
      <span data-headline>{{TITLE}}</span>
    </div>
  </div>
  <div class="ldocw-ticker-bar">
    <div class="ldocw-ticker-rule" aria-hidden="true"></div>
    <div class="ldocw-ticker-track">
      <div class="ldocw-ticker-scroll">
        <span data-ticker>{{SUBTITLE}} — Documentary series — {{TITLE}} — A deeper look</span>
        <span data-ticker aria-hidden="true">{{SUBTITLE}} — Documentary series — {{TITLE}} — A deeper look</span>
      </div>
    </div>
  </div>
</div>

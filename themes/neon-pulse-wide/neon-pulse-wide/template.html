<div class="neonw" data-slt-root>
  <div class="neonw-topbar">
    <div class="neonw-card-wrap">
      <div class="neon-card">
        <div class="neon-bg" aria-hidden="true"></div>
        <div class="neon-glow-border" aria-hidden="true"></div>
        <div class="neon-content">
          <div class="neon-title" data-title>{{TITLE}}</div>
          <div class="neon-subtitle" data-subtitle>{{SUBTITLE}}</div>
        </div>
      </div>
    </div>
    <div class="neonw-headline">
      <span data-headline>{{TITLE}}</span>
    </div>
  </div>
  <div class="neonw-ticker-bar">
    <div class="neonw-ticker-label">LIVE</div>
    <div class="neonw-ticker-track">
      <div class="neonw-ticker-scroll">
        <span data-ticker>{{SUBTITLE}} — Stream update — {{TITLE}} — Stay connected</span>
        <span data-ticker aria-hidden="true">{{SUBTITLE}} — Stream update — {{TITLE}} — Stay connected</span>
      </div>
    </div>
  </div>
</div>

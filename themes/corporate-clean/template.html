<div class="corp-card" data-slt-root>
  <div class="corp-bg" aria-hidden="true"></div>
  <div class="corp-accent-line" aria-hidden="true"></div>
  <div class="corp-content">
    <img class="corp-avatar" src="{{PROFILE_PICTURE_URL}}" alt="" onerror="this.style.display='none'" />
    <div class="corp-text">
      <div class="corp-title" data-title>{{TITLE}}</div>
      <div class="corp-subtitle" data-subtitle>{{SUBTITLE}}</div>
    </div>
  </div>
</div>

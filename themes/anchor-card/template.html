<div class="anchor-card" data-slt-root>
  <div class="anchor-bg" aria-hidden="true"></div>
  <div class="anchor-stripe" aria-hidden="true"></div>
  <div class="anchor-content">
    <img class="anchor-avatar" src="{{PROFILE_PICTURE_URL}}" alt="" onerror="this.style.display='none'" />
    <div class="anchor-text">
      <div class="anchor-title" data-title>{{TITLE}}</div>
      <div class="anchor-subtitle" data-subtitle>{{SUBTITLE}}</div>
    </div>
  </div>
</div>

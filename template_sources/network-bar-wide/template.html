<div class="nbarw" data-slt-root>
  <!-- Top bar: full width headline with original card embedded -->
  <div class="nbarw-topbar">
    <div class="nbarw-accent-edge" aria-hidden="true"></div>
    <div class="nbarw-card">
      <div class="nbar-accent" aria-hidden="true"></div>
      <div class="nbar-content">
        <div class="nbar-title" data-title>{{TITLE}}</div>
        <span class="nbar-sep" aria-hidden="true">|</span>
        <div class="nbar-subtitle" data-subtitle>{{SUBTITLE}}</div>
      </div>
    </div>
    <div class="nbarw-headline" aria-hidden="true">
      <span data-headline>{{TITLE}}</span>
    </div>
  </div>
  <!-- Bottom ticker: scrolling text -->
  <div class="nbarw-ticker-bar">
    <div class="nbarw-ticker-label">LIVE</div>
    <div class="nbarw-ticker-track">
      <div class="nbarw-ticker-scroll">
        <span data-ticker>{{SUBTITLE}} — Stay tuned for more updates — {{TITLE}} — Live coverage continues</span>
        <span data-ticker aria-hidden="true">{{SUBTITLE}} — Stay tuned for more updates — {{TITLE}} — Live coverage continues</span>
      </div>
    </div>
  </div>
</div>

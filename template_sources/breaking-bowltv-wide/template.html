<div class="btvw" data-slt-root>
  <div class="btvw-topbar">
    <div class="btvw-card">
      <div class="btv-bg" aria-hidden="true"></div>
      <div class="btv-content">
        <div class="btv-badge-wrap">
          <img class="btv-logo" src="https://static.maestro.io/media/5c09513f58dfae005af67a20/609565fe6e4c5d00a50a0736.png" alt="BowlTV" />
          <div class="btv-badge">BREAKING</div>
        </div>
        <div class="btv-divider" aria-hidden="true"></div>
        <div class="btv-text">
          <div class="btv-title" data-title>{{TITLE}}</div>
          <div class="btv-subtitle" data-subtitle>{{SUBTITLE}}</div>
        </div>
      </div>
    </div>
    <div class="btvw-headline">
      <span data-headline>{{TITLE}}</span>
    </div>
  </div>
  <div class="btvw-ticker-bar">
    <div class="btvw-ticker-label">BOWLTV</div>
    <div class="btvw-ticker-track">
      <div class="btvw-ticker-scroll">
        <span data-ticker>{{SUBTITLE}} — Live bowling coverage — {{TITLE}} — Results and standings updates</span>
        <span data-ticker aria-hidden="true">{{SUBTITLE}} — Live bowling coverage — {{TITLE}} — Results and standings updates</span>
      </div>
    </div>
  </div>
</div>

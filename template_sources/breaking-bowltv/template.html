<div class="btv-card" data-slt-root>
  <div class="btv-bg" aria-hidden="true"></div>
  <div class="btv-content">
    <div class="btv-badge-wrap">
      <img class="btv-logo" src="https://static.maestro.io/media/5c09513f58dfae005af67a20/609565fe6e4c5d00a50a0736.png" alt="BowlTV" />
      <div class="btv-badge">BREAKING</div>
    </div>
    <div class="btv-divider" aria-hidden="true"></div>
    <div class="btv-text">
      <div class="btv-title" data-title>{{TITLE}}</div>
      <div class="btv-subtitle" data-subtitle>{{SUBTITLE}}</div>
    </div>
  </div>
  <div class="btv-accent-bar" aria-hidden="true"></div>
</div>

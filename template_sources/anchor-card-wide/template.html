<div class="ancw" data-slt-root>
  <div class="ancw-topbar">
    <div class="ancw-card">
      <div class="anchor-bg" aria-hidden="true"></div>
      <div class="anchor-stripe" aria-hidden="true"></div>
      <div class="anchor-content">
        <img class="anchor-avatar" src="{{PROFILE_PICTURE_URL}}" alt="" onerror="this.style.display='none'" />
        <div class="anchor-text">
          <div class="anchor-title" data-title>{{TITLE}}</div>
          <div class="anchor-subtitle" data-subtitle>{{SUBTITLE}}</div>
        </div>
      </div>
    </div>
    <div class="ancw-headline">
      <span data-headline>{{TITLE}}</span>
    </div>
  </div>
  <div class="ancw-ticker-bar">
    <div class="ancw-ticker-label">NOW</div>
    <div class="ancw-ticker-track">
      <div class="ancw-ticker-scroll">
        <span data-ticker>{{SUBTITLE}} — Live now — {{TITLE}} — Follow for updates</span>
        <span data-ticker aria-hidden="true">{{SUBTITLE}} — Live now — {{TITLE}} — Follow for updates</span>
      </div>
    </div>
  </div>
</div>
